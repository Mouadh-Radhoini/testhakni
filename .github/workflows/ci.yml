# Integration continue (SET-03) : build + tests du backend et du frontend
# a chaque push et a chaque pull request.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        # 7.0 et non 8.0 : l'image 8.0 refuse de demarrer sur les runners GitHub
        # (kernel Linux >= 6.19, incompatibilite connue MongoDB SERVER-121912).
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests (JUnit + MockMvc)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/testhakni_test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production
        run: npm run build
      - name: Tests (Karma / Jasmine)
        run: npx ng test --watch=false --browsers=ChromeHeadless
