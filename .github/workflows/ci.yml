# Integration continue (SET-03) : build + tests du backend et du frontend
# a chaque push et a chaque pull request.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: MongoDB 7 replica set
        run: |
          docker run --name mongo-test -p 127.0.0.1:27017:27017 -d mongo:7.0 --replSet rs0 --bind_ip_all
          timeout 90 bash -c 'until docker exec mongo-test mongosh --quiet --eval "db.runCommand({ping:1})"; do sleep 2; done'
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          timeout 90 bash -c 'until docker exec mongo-test mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 2; done'
      - name: Tests (JUnit + MockMvc)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/testhakni_test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production
        run: npm run build
      - name: Tests (Karma / Jasmine)
        run: npx ng test --watch=false --browsers=ChromeHeadless

  workflow:
    name: Parcours navigateur (Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire et vérifier la pile isolée
        env:
          MONGO_IMAGE: mongo:7.0
        run: |
          python3 scripts/stack_env.py "$RUNNER_TEMP/testhakni.env" --demo
          set -a
          source "$RUNNER_TEMP/testhakni.env"
          set +a
          docker compose -p testhakni-ci -f docker-compose.stack.yml config --quiet
          docker compose -p testhakni-ci -f docker-compose.stack.yml up --build -d --wait
          python3 -m pip install playwright==1.56.0
          python3 scripts/demo_e2e.py
