server {
    listen 8080;
    server_name _;
    proxy_set_header Host $http_host;
    root /usr/share/nginx/html;
    location /api/ { proxy_pass http://backend:8080; client_max_body_size 3m; }
    # Messagerie temps reel (STOMP sur WebSocket)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location /swagger-ui { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
