spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      enabled: false
  application:
    name: testhakni-backend
  profiles:
    # Profil utilise si SPRING_PROFILES_ACTIVE n'est pas defini
    default: dev
  data:
    mongodb:
      # Surchargeable avec la variable d'environnement MONGODB_URI (ex. MongoDB Atlas)
      uri: ${MONGODB_URI:mongodb://localhost:27017/testhakni}
      # Cree les index declares avec @Indexed / @CompoundIndex (email unique, etc.)
      auto-index-creation: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Cle HMAC encodee en Base64 (>= 256 bits). A REMPLACER en production via JWT_SECRET.
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    # Claims "iss" et "aud" verifies a chaque lecture de token (SEC-05)
    issuer: ${JWT_ISSUER:testhakni-backend}
    audience: ${JWT_AUDIENCE:testhakni-web}
  security:
    # Anti force brute sur /api/auth (SEC-04) : au plus <capacity> requetes par <period>
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login: { capacity: 10, period: 1m }        # par adresse IP
      register: { capacity: 10, period: 1h }     # par adresse IP
      refresh: { capacity: 30, period: 1m }      # par adresse IP
      failed-logins: { capacity: 5, period: 15m } # echecs par compte avant blocage temporaire
  seed:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
