services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:8.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${APP_DATABASE:-testhakni}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ ! -s /data/configdb/replica.key ]; then
          umask 077
          openssl rand -base64 512 > /data/configdb/replica.key
        fi
        chown mongodb:mongodb /data/configdb/replica.key
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/configdb/replica.key
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./deploy/init-app-user.js:/docker-entrypoint-initdb.d/01-user.js:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          const admin=db.getSiblingDB('admin');
          admin.auth('root',process.env.MONGO_INITDB_ROOT_PASSWORD);
          if (admin.hello().isreplicaset)
          admin.runCommand({replSetInitiate:{_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}});
          quit(admin.hello().isWritablePrimary && admin.hello().setName==='rs0' ? 0 : 1)
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    image: testhakni-backend:${RELEASE_TAG:-local}
    build: ./backend
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      MONGODB_URI: mongodb://marketplace:${MONGO_APP_PASSWORD}@mongodb:27017/${APP_DATABASE:-testhakni}?replicaSet=rs0
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 30
  frontend:
    image: testhakni-frontend:${RELEASE_TAG:-local}
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
  mongo-config:
